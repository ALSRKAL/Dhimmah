name: dhimmah
description: "Dhimmah — Know what you owe. Know what you're owed."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  bidi: ^2.0.13
  collection: ^1.19.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  drift: ^2.35.0
  file_selector: ^1.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.0
  go_router: ^17.5.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  meta: ^1.18.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.0
  sqlite3: ^3.5.2
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    # The mark itself, for the logo the app draws, and the smaller copy a
    # printed statement embeds. The rest of assets/icon is input to the platform
    # icon pipeline — the launcher and the store read those from the build, not
    # from the bundle.
    - assets/icon/icon.png
    - assets/icon/mark_document.png

  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
