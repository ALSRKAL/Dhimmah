# Static analysis for Dhimmah.
#
# The generated sources (drift builders, gen-l10n output) are excluded because
# they are not hand-maintained and would otherwise drown real findings.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/generated/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_redundant_argument_values
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - unawaited_futures
    - use_super_parameters
